@keyframes fadeInUp {

<script>
  function instantLoginCheck(event) {
    event.preventDefault(); 
    const localData = JSON.parse(localStorage.getItem('dr_streaming_manager_v1') || '{}');
    const correctPassword = (localData.settings && localData.settings.password) ? localData.settings.password : 'admin';
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if (u === 'admin' && p === correctPassword) {
      sessionStorage.setItem('auth', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      if(window.renderApp) window.renderApp(); 
    } else {
      alert("Incorrect Username or Password.");
    }
  }
</script>

function getBuffer(len) {
  const b = new Uint8Array(len);
  window.crypto.getRandomValues(b);
  return b;
}

window.setupBiometrics = async function() {
  if (!window.PublicKeyCredential) {
    alert("Biometric login is not supported on this browser or device.");
    return;
  }
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: getBuffer(32),
        rp: { name: "DR Streaming", id: window.location.hostname || "localhost" },
        user: { id: getBuffer(16), name: "admin", displayName: "Admin" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000,
        attestation: "none"
      }
    });
    const credId = Array.from(new Uint8Array(cred.rawId));
    localStorage.setItem('bioCredId', JSON.stringify(credId));
    alert("Fingerprint / Face ID setup successful!");
    document.getElementById('bioLoginBtn').style.display = 'block';
  } catch(e) {
    console.error(e);
    alert("Biometric setup failed or was canceled.");
  }
}

window.loginWithBiometrics = async function() {
  const storedId = JSON.parse(localStorage.getItem('bioCredId'));
  if(!storedId) return alert("Biometrics not set up yet. Log in with password and enable it in Settings.");
  try {
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: getBuffer(32),
        rpId: window.location.hostname || "localhost",
        allowCredentials: [{ type: "public-key", id: new Uint8Array(storedId) }],
        userVerification: "required",
        timeout: 60000
      }
    });
    if(assertion) {
      sessionStorage.setItem('auth', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      render();
    }
  } catch(e) {
    console.error(e);
    alert("Fingerprint / Face ID verification failed.");
  }
}

async function save(){
  localStorage.setItem(DB,JSON.stringify(data));
  if(!cloudReady) return;
  try{
    saving=true;
    document.getElementById('syncStatus').textContent='BUSINESS MANAGER • SAVING...';
    await setDoc(cloudRef,{data,updatedAt:new Date().toISOString()});
    document.getElementById('syncStatus').textContent='BUSINESS MANAGER • CLOUD SYNCED ✓';
  }catch(e){
    console.error(e);
    document.getElementById('syncStatus').textContent='BUSINESS MANAGER • OFFLINE COPY SAVED';
  }finally{saving=false}
}

const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dateObj=d=>new Date(d+'T00:00:00');
const expiry=(d,n)=>{let x=dateObj(d);x.setDate(x.getDate()+Number(n));return x.toISOString().slice(0,10)};
const days=d=>Math.ceil((dateObj(d)-new Date(new Date().toDateString()))/86400000);
const status=s=>!s.expiry?'—':days(s.expiry)<0?'Expired':days(s.expiry)<=7?'Expiring':'Active';

const getFilteredSales = () => {
  const now = new Date();
  let targetYear = now.getFullYear();
  let targetMonth = now.getMonth();

  if(dashMode === 'prev') {
    targetMonth -= 1;
    if(targetMonth < 0) {
      targetMonth = 11;
      targetYear -= 1;
    }
  }

  return data.sales.filter(s => {
    let d = dateObj(s.date);
    return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
  });
};

const getFilteredExpenses = () => {
  const now = new Date();
  let targetYear = now.getFullYear();
  let targetMonth = now.getMonth();

  if(dashMode === 'prev') {
    targetMonth -= 1;
    if(targetMonth < 0) {
      targetMonth = 11;
      targetYear -= 1;
    }
  }

  return data.expenses.filter(e => {
    let d = dateObj(e.date);
    return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
  });
};

const income=a=>a.filter(s=>s.payment==='Paid').reduce((x,s)=>x+Number(s.amount||0),0) + a.filter(s=>s.payment==='Partial').reduce((x,s)=>x+Number(s.partialPaid||0),0);

function getProductIcon(productName) {

      return `<img src="${esc(matched.imageUrl)}" alt="${esc(matched.name)} logo" style="width:32px;height:32px;object-fit:contain;" />`;

    if (matched.icon) {
      return `<img src="${esc(matched.icon)}" alt="${esc(matched.name)} logo" style="width:32px;height:32px;object-fit:contain;" />`;

function showDetails(type){
 const activeSales = getFilteredSales();
 const activeExpList = getFilteredExpenses();
 const paid=income(activeSales), cost=purchase(activeSales), exp=expenses(activeExpList);
 const pending=data.sales.filter(s=>s.payment!=='Paid');
 let title='',body='';
 const list=a=>a.length?`<div class="table"><table><thead><tr><th>Client</th><th>Item</th><th>Amount</th><th>Status</th></tr></thead><tbody>${a.map(s=>`<tr><td>${esc(s.client)}</td><td>${esc(s.product)}</td><td>${rs(s.amount)}</td><td>${s.payment}${s.payment==='Partial'?`<br><span style="font-size:10px;color:var(--muted)">Paid: ${rs(s.partialPaid)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No records found.</div>';
 if(type==='income'){title=`💼 Paid Income (${dashMode==='prev'?'Previous Month':'Current Month'})`;body=`<h2>${rs(paid)}</h2>${list(activeSales.filter(s=>s.payment==='Paid' || s.payment==='Partial'))}`;}
 if(type==='purchase'){let purchased=activeSales.filter(s=>Number(s.purchase||0)>0 && s.payment!=='Pending');title=`🛒 Purchase Cost (${dashMode==='prev'?'Previous Month':'Current Month'})`;body=`<h2>${rs(cost)}</h2>${list(purchased)}`;}
 if(type==='expenses'){title=`💸 Business Expenses (${dashMode==='prev'?'Previous Month':'Current Month'})`;body=`<h2>${rs(exp)}</h2>${list(activeExpList)}<br><button class="primary" onclick="closeModal();go('expenses')">Open Expenses</button>`;}
 if(type==='profit'){title=`📈 Net Profit Breakdown (${dashMode==='prev'?'Previous Month':'Current Month'})`;body=`<div class="card card-blue"><small>PAID INCOME</small><b>${rs(paid)}</b></div><br><div class="card card-orange"><small>MINUS PURCHASE COST</small><b>− ${rs(cost)}</b></div><br><div class="card card-purple"><small>MINUS EXPENSES</small><b>− ${rs(exp)}</b></div><br><div class="card card-green"><small>NET PROFIT</small><b>${rs(paid-cost-exp)}</b></div>`;}
 if(type==='manager'){let a=activeSales.filter(s=>s.owner==='Manager'&&(s.payment==='Paid'||s.payment==='Partial'));title='👤 Manager Sales';body=`<h2>${rs(income(a))}</h2>${list(a)}`;}
 if(type==='admin'){let a=activeSales.filter(s=>s.owner==='Admin'&&(s.payment==='Paid'||s.payment==='Partial'));title='👑 Admin Sales';body=`<h2>${rs(income(a))}</h2>${list(a)}`;}
 if(type==='transactions'){title='📦 Transactions';body=`<p class="muted">${activeSales.length} records</p>${list(activeSales)}`;}
 if(type==='pending'){title='⏳ Pending Payments (All-Time)';body=`<h2>${rs(pending.reduce((x,s)=>x+(s.amount - (s.partialPaid||0)),0))} Remaining</h2>${list(pending)}<br><button class="primary" onclick="closeModal();go('pending')">Manage Pending Payments</button>`;}
 modal(`<div class="sectionHead"><h2>${title}</h2><button onclick="closeModal()">×</button></div>${body}`);
}

window.filterCatalogSearch = function() {

function backup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dr_streaming_backup_${today()}.json`;
  a.click();
}

function restore(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(parsed.sales && parsed.products) {
        data = parsed;
        save();
        render();
        alert('Data restored successfully!');
      } else {
        alert('Invalid backup file format.');
      }
    } catch(err) {
      alert('Failed to parse backup JSON.');
    }
  };
  reader.readAsText(file);
}

function salesTable(a,actions=true){
 if(!a.length)return '<div class="empty">No records yet.</div>';
 return `<div class="table"><table><thead><tr><th>Client</th><th>Item</th><th>Owner</th><th>Amount</th><th>Status</th><th>Date / Expiry</th>${actions?'<th></th>':''}</tr></thead><tbody>${a.map(s=>`<tr><td><b>${esc(s.client||'Walk-in')}</b><br><span class="muted">${esc(s.phone||'')}</span> ${s.phone?`<a href="https://wa.me/${String(s.phone).replace(/[^0-9]/g, '')}" target="_blank" style="text-decoration:none" title="Chat on WhatsApp">${waSVG}</a>`:''}</td><td><div style="display:flex;align-items:center;gap:8px;">${getProductIcon(s.product)}<div><b>${esc(s.product)}</b><br><span class="muted">${s.type}</span></div></div></td><td>${s.owner==='Manager'?'👤 Manager':'👑 Admin'}</td><td>${rs(s.amount)}${s.payment==='Partial'?`<br><span style="color:#b91c1c;font-size:10px">Rem: ${rs(s.amount - (s.partialPaid||0))}</span>`:''}</td><td><select class="badge ${s.payment==='Paid'?'Active':s.payment==='Pending'?'Expired':'Expiring'}" onchange="quickPayment(${s.id}, this.value)" style="border:none;cursor:pointer;outline:none"><option value="Paid" ${s.payment==='Paid'?'selected':''}>Paid</option><option value="Pending" ${s.payment==='Pending'?'selected':''}>Pending</option><option value="Partial" ${s.payment==='Partial'?'selected':''}>Partial</option></select></td><td>${s.type==='Subscription'?`${s.expiry}<br><span class="badge ${status(s)}">${status(s)}</span>`:s.date}</td>${actions?`<td style="white-space:nowrap"><button class="small" onclick="viewClient(${s.id})" title="View Details">👁️</button> <button class="small" style="background:#fef3c7;color:#92400e" onclick="editSale(${s.id})" title="Edit Full Record">✏️</button> <button class="danger small" onclick="delSale(${s.id})" title="Delete">🗑️</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function salesPage(){return `<div class="sectionHead"><div><h1>Sales</h1><span class="muted">Subscriptions & products</span></div><button class="primary" onclick="openSale()">＋ Add Sale</button></div><section>${salesTable(data.sales,true)}</section>`}

function productsPage(){
 const now=new Date();
 let totalQty=0; let totalProfit=0;
 
 const rows = data.products.map(p=>{
   let pSales = data.sales.filter(s => {
     if(s.product !== p.name || s.payment === 'Pending') return false;
     let d = dateObj(s.date);
     if(reportRange==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
     if(reportRange==='year') return d.getFullYear()===now.getFullYear();
     return true;
   });
   let qty = pSales.length;
   let profit = pSales.reduce((sum, s) => sum + ((s.payment==='Partial'?s.partialPaid:Number(s.amount||0)) - Number(s.purchase||0)), 0);
   totalQty += qty;
   totalProfit += profit;
   return `<tr>
     <td><div style="display:flex;align-items:center;gap:8px;">${getProductIcon(p.name)}<div><b>${esc(p.name)}</b><br><span class="muted">${p.type}</span></div></div></td>
     <td>${rs(p.price)}</td>
     <td><span style="background:#f4efe6;padding:4px 8px;border-radius:12px;font-weight:bold;font-size:11px">${qty}x</span></td>
     <td><b style="color:#166534">${rs(profit)}</b></td>
     <td style="white-space:nowrap">
       <button class="small" onclick="viewProduct(${p.id})">👁️ View</button>
       <button class="small" style="background:#fef3c7;color:#92400e;margin:0 4px;" onclick="editProduct(${p.id})" title="Edit Product">✏️ Edit</button>
       <button class="danger small" onclick="delProduct(${p.id})" title="Delete">🗑️</button>
     </td>
   </tr>`;
 }).join('');

 return `<div class="sectionHead"><div><h1>Products & Analytics</h1><span class="muted">Track quantity sold and net profit</span></div><button class="primary" onclick="openProduct()">＋ Add Product</button></div>
 <div class="tabs" style="margin-bottom:14px">
   <button class="tab ${reportRange==='month'?'on':''}" onclick="reportRange='month';render()">This Month</button>
   <button class="tab ${reportRange==='year'?'on':''}" onclick="reportRange='year';render()">This Year</button>
   <button class="tab ${reportRange==='all'?'on':''}" onclick="reportRange='all';render()">All Time</button>
 </div>
 <div class="cards">
   <div class="card card-blue"><small>TOTAL QTY SOLD</small><b>${totalQty}x</b></div>
   <div class="card card-green"><small>TOTAL NET PROFIT</small><b>${rs(totalProfit)}</b></div>
 </div>
 <section>${data.products.length?`<div class="table"><table><thead><tr><th>Product Icon</th><th>Price</th><th>Qty Sold</th><th>Net Profit</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Add your first product or subscription service.</div>'}</section>`
}

function viewProduct(id){
  let p = data.products.find(x => x.id === id);
  if(!p) return;
  const now = new Date();
  let pSales = data.sales.filter(s => {
     if(s.product !== p.name || s.payment === 'Pending') return false;
     let d = dateObj(s.date);
     if(reportRange==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
     if(reportRange==='year') return d.getFullYear()===now.getFullYear();
     return true;
  });
  
  let qty = pSales.length;
  let revenue = pSales.reduce((sum, s) => sum + (s.payment==='Partial'?s.partialPaid:Number(s.amount||0)), 0);
  let profit = pSales.reduce((sum, s) => sum + ((s.payment==='Partial'?s.partialPaid:Number(s.amount||0)) - Number(s.purchase||0)), 0);

  modal(`<div class="sectionHead"><h2>${esc(p.name)} Analytics</h2><button onclick="closeModal()">×</button></div>
  <div class="cards">
    <div class="card card-blue"><small>QUANTITY SOLD</small><b>${qty}x</b></div>
    <div class="card card-green"><small>TOTAL REVENUE</small><b>${rs(revenue)}</b></div>
    <div class="card card-purple"><small>NET PROFIT</small><b>${rs(profit)}</b></div>
  </div>
  <br>
  <div class="table"><table><thead><tr><th>Date</th><th>Client</th><th>Revenue</th><th>Profit</th></tr></thead><tbody>
  ${pSales.length ? pSales.map(s=>{
    let rev = s.payment==='Partial' ? s.partialPaid : Number(s.amount||0);
    let prof = rev - Number(s.purchase||0);
    return `<tr><td>${s.date}</td><td><b>${esc(s.client)}</b></td><td>${rs(rev)}</td><td><b style="color:#166534">${rs(prof)}</b></td></tr>`;
  }).join('') : `<tr><td colspan="4" class="empty">No paid sales found for this period.</td></tr>`}
  </tbody></table></div>`);
}

function clientsPage(){
 let map={};data.sales.forEach(s=>{if(!s.client)return;let k=s.client+'|'+(s.phone||'');if(!map[k])map[k]={name:s.client,phone:s.phone,total:0,count:0};map[k].total+=Number(s.amount);map[k].count++});
 let a=Object.values(map);return `<h1>Clients</h1><p class="muted">All customers and their purchases</p><section>${a.length?`<div class="table"><table><thead><tr><th>Client</th><th>Phone</th><th>Purchases</th><th>Total</th><th>Action</th></tr></thead><tbody>${a.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')} ${c.phone?`<a href="https://wa.me/${String(c.phone).replace(/[^0-9]/g, '')}" target="_blank" style="text-decoration:none" title="Chat on WhatsApp">${waSVG}</a>`:''}</td><td>${c.count}</td><td>${rs(c.total)}</td><td><button class="small" onclick="editClient(decodeURIComponent('${encodeURIComponent(c.name)}'), decodeURIComponent('${encodeURIComponent(c.phone||'')}'))" title="Edit Client">✏️ Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No clients yet.</div>'}</section>`
}

function editClient(oldName, oldPhone){
  modal(`<div class="sectionHead"><h2>Edit Client Info</h2><button onclick="closeModal()">×</button></div>
  <form id="editClientForm" class="grid">
    <p class="full muted" style="margin-top:0;">Updates the name and phone number for <b>all</b> records belonging to this client.</p>
    <label class="field full"><span>Client Name *</span><input id="editCName" required value="${esc(oldName)}"></label>
    <label class="field full"><span>Phone / WhatsApp</span><input id="editCPhone" value="${esc(oldPhone)}"></label>
    <div class="full actions">
      <button type="button" onclick="closeModal()">Cancel</button>
      <button class="primary" type="submit">Save Changes</button>
    </div>
  </form>`);

  document.getElementById('editClientForm').onsubmit = e => {
    e.preventDefault();
    const newName = document.getElementById('editCName').value.trim();
    const newPhone = document.getElementById('editCPhone').value.trim();
    
    if(!newName) return;

    data.sales.forEach(s => {
      if(s.client === oldName && (s.phone || '') === oldPhone) {
        s.client = newName;
        s.phone = newPhone;
      }
    });

    save();
    closeModal();
    render();
  };
}

function markPaid(id){
 let sale=data.sales.find(s=>s.id===id);
 if(sale){
   sale.payment='Paid';
   sale.partialPaid=0;
   sale.paymentDate=prompt('Payment date (YYYY-MM-DD):', sale.paymentDate||today())||today();
   save();render();
 }
}
function quickPayment(id, value){
  let sale=data.sales.find(s=>s.id===id);
  if(sale){
    if(value === 'Partial') {
      let p = prompt(`Enter amount paid so far (Total Bill: Rs. ${sale.amount}):`, sale.partialPaid || 0);
      if(p !== null && !isNaN(p)) {
        sale.partialPaid = Number(p);
      } else {
        render(); return; 
      }
    }
    sale.payment=value;
    if(value==='Paid'&&!sale.paymentDate)sale.paymentDate=today();
    if(value!=='Partial') sale.partialPaid = 0;
    save();render();
  }
}

 });
 const periodExpenses = data.expenses.filter(e => {

   if(reportRange==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
   if(reportRange==='year') return d.getFullYear()===now.getFullYear();

 });
 
 const totalRev = filteredSales.reduce((sum, s) => sum + (s.payment==='Partial'?s.partialPaid:Number(s.amount||0)), 0);

function reports(){
 const now=new Date(), filtered=data.sales.filter(s=>{let d=dateObj(s.date);if(reportRange==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();if(reportRange==='year')return d.getFullYear()===now.getFullYear();return true});
 const r=income(filtered.filter(s=>s.owner==='Manager')),t=income(filtered.filter(s=>s.owner==='Admin'));
 const periodExpenses=data.expenses.filter(e=>{let d=dateObj(e.date);if(reportRange==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();if(reportRange==='year')return d.getFullYear()===now.getFullYear();return true});
 const pc=purchase(filtered.filter(s=>s.payment==='Paid'||s.payment==='Partial')), ex=expenses(periodExpenses), net=income(filtered)-pc-ex;
 let months=Array.from({length:12},(_,i)=>({m:new Date(now.getFullYear(),i,1).toLocaleString('en',{month:'short'}),v:income(data.sales.filter(s=>{let d=dateObj(s.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===i}))}));
 return `<h1>Sales Reports</h1><div class="tabs"><button class="tab ${reportRange==='month'?'on':''}" onclick="reportRange='month';render()">This Month</button><button class="tab ${reportRange==='year'?'on':''}" onclick="reportRange='year';render()">This Year</button><button class="tab ${reportRange==='all'?'on':''}" onclick="reportRange='all';render()">All Time</button></div>

   <div class="card card-blue"><small>MANAGER</small><b>${rs(r)}</b></div>

}

function showMonthDetails(mIndex){
  const year = new Date().getFullYear();
  const monthSales = data.sales.filter(s => {
    let d = dateObj(s.date);
    return d.getFullYear() === year && d.getMonth() === mIndex;
  });
  const monthName = new Date(year, mIndex, 1).toLocaleString('en', {month: 'long'});
  
  const monthIncome = income(monthSales);
  const monthCost = purchase(monthSales.filter(s=>s.payment==='Paid'||s.payment==='Partial'));
  const monthProfit = monthIncome - monthCost;
  
  let body = '';
  if(monthSales.length){
    body = `<div class="table"><table><thead><tr><th>Client</th><th>Product</th><th>Amount Paid</th><th>Cost</th><th>Profit</th><th>Status</th></tr></thead><tbody>${monthSales.map(s=>{
      let paidAmt = s.payment==='Paid' ? Number(s.amount||0) : (s.payment==='Partial' ? Number(s.partialPaid||0) : 0);
      let costAmt = (s.payment!=='Pending') ? Number(s.purchase||0) : 0;
      let profit = paidAmt - costAmt;
      return `<tr><td><b>${esc(s.client)}</b></td><td>${esc(s.product)}</td><td>${rs(paidAmt)}</td><td>${rs(costAmt)}</td><td><b style="color:#166534">${rs(profit)}</b></td><td><span class="badge ${s.payment==='Paid'?'Active':s.payment==='Pending'?'Expired':'Expiring'}">${s.payment}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
  } else {
    body = `<div class="empty">No sales records found for ${monthName} ${year}.</div>`;
  }
  
  modal(`<div class="sectionHead"><h2>${monthName} ${year} Analytics</h2><button onclick="closeModal()">×</button></div>
  <div class="cards">
    <div class="card card-blue"><small>TRANSACTIONS</small><b>${monthSales.length}</b></div>
    <div class="card card-green"><small>PAID INCOME</small><b>${rs(monthIncome)}</b></div>
    <div class="card card-purple"><small>NET PROFIT</small><b>${rs(monthProfit)}</b></div>
  </div><br>${body}`);
}

window.renderApp = function() {
  document.getElementById('app').innerHTML=page==='dashboard'?dashboard():page==='sales'?salesPage():page==='products'?productsPage():page==='clients'?clientsPage():page==='pending'?pendingPage():page==='expenses'?expensesPage():page==='profit'?profitPage():page==='settings'?settingsPage():reports();
}
function render(){ window.renderApp(); }

Object.assign(window,{
  modal, closeModal, go, dashboard, showDetails, salesTable, salesPage, editSale,
  productsPage, viewProduct, editProduct, clientsPage, editClient, pendingPage, markPaid, quickPayment, viewClient,
  expensesPage, openExpense, delExpense, profitPage, reports, showMonthDetails, render, openProduct,
  openSale, delSale, delProduct, backup, restore, signOutApp, settingsPage, saveCredentials, filterCatalogSearch,
  selectCatalogProduct, resetCatalogSelection, onClientNameChange
});
Object.defineProperty(window,'reportRange',{
  get:()=>reportRange,
  set:(v)=>{reportRange=v;}
});
Object.defineProperty(window,'dashMode',{
  get:()=>dashMode,
  set:(v)=>{dashMode=v;}
});

render();

let syncTimeout = setTimeout(() => {
  if(!cloudReady) {
    document.getElementById('syncStatus').textContent='BUSINESS MANAGER • OFFLINE / LOCAL DATA';
  }
}, 4000);

onSnapshot(cloudRef, async (snap)=>{
  clearTimeout(syncTimeout);
  try{
    if(snap.exists() && snap.data().data){
      const incoming=snap.data().data;
      if(!incoming.sales) incoming.sales=[];
      if(!incoming.products || incoming.products.length === 0) incoming.products = starterProducts;
      if(!incoming.expenses) incoming.expenses=[];
      if(!incoming.settings) incoming.settings={password:'admin'};
      data=incoming;
      localStorage.setItem(DB,JSON.stringify(data));
      cloudReady=true;
      document.getElementById('syncStatus').textContent='BUSINESS MANAGER • CLOUD SYNCED ✓';
      render();
    }else{
      cloudReady=true;
      await save();
      document.getElementById('syncStatus').textContent='BUSINESS MANAGER • CLOUD SYNCED ✓';
    }
  }catch(e){console.error(e);}
},(err)=>{
  console.error(err);
  document.getElementById('syncStatus').textContent='BUSINESS MANAGER • OFFLINE MODE';
});

let deferredInstallPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredInstallPrompt=e;
  document.getElementById('installBtn').style.display='inline-block';
});
window.installApp=async function(){
  if(!deferredInstallPrompt){alert('Open this app from its HTTPS website link in Chrome to install.');return;}
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  document.getElementById('installBtn').style.display='none';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>
